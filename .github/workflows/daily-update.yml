name: Daily Data Update

on:
  schedule:
    # כל יום ב-06:00 UTC = 09:00 שעון ישראל
    - cron: '0 6 * * *'
  workflow_dispatch:   # מאפשר הרצה ידנית בלחיצת כפתור

permissions:
  contents: write   # נדרש כדי לדחוף את הקבצים המעודכנים חזרה ל-Repository

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # התקנת החבילות ישירות בלי צורך בקובץ requirements.txt חיצוני
          pip install requests pandas numpy python-dotenv

      - name: Run daily update
        env:
          # שליפת המפתח החסוי שהגדרת בתוך ה-Secrets של ה-Repo
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # אם הסקריפט שלך משתמש גם במפתח של Football-Data, הסירי את ה-# מהשורה הבאה:
          # FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python 1_fetch_data.py

        - name: Write last-updated timestamp
        run: |
          mkdir -p data
          TZ="Asia/Jerusalem" date +'%d/%m/%Y %H:%M' > data/last_updated.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
