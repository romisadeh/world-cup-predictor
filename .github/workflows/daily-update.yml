name: Daily Data Update

on:
  schedule:
    # כל יום ב-06:12 UTC = 09:12 שעון ישראל (שעה לא עגולה למניעת עומסי שרת)
    - cron: '12 6 * * *'
  workflow_dispatch:   # מאפשר לך להריץ ידנית בכל רגע בלחיצת כפתור

permissions:
  contents: write   # נדרש כדי לתת לבוט הרשאה לדחוף את הקבצים המעודכנים חזרה ל-Repository

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy python-dotenv

      - name: Run daily update
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python 1_fetch_data.py

      - name: Write last-updated timestamp
        run: |
          mkdir -p data
          TZ="Asia/Jerusalem" date +'%d/%m/%Y %H:%M' > data/last_updated.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull origin main --no-rebase -X ours
            git push
          fi
